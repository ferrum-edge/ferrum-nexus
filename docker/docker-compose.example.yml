# Example full stack: Ferrum Nexus + PostgreSQL + a Ferrum Edge gateway.
#
#   cp docker/docker-compose.example.yml docker-compose.yml
#   export NEXUS_SECRET_KEY=$(openssl rand -hex 32)
#   export FERRUM_ADMIN_JWT_SECRET=$(openssl rand -hex 32)
#   docker compose up -d
#
# The portal is then on http://127.0.0.1:8787 and the gateway's proxy
# listener on http://127.0.0.1:8000.

services:
  nexus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:?set NEXUS_SECRET_KEY}
      NEXUS_PUBLIC_URL: http://127.0.0.1:8787
      NEXUS_DB_DRIVER: postgres
      NEXUS_DB_URL: postgres://nexus:nexus@postgres:5432/nexus
      FERRUM_ADMIN_URL: http://ferrum-edge:9000
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?set FERRUM_ADMIN_JWT_SECRET}
      FERRUM_ADMIN_ALLOW_INSECURE_HTTP: 'true' # in-network compose traffic only
      FERRUM_NAMESPACE: nexus
    depends_on:
      postgres:
        condition: service_healthy
      ferrum-edge:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ferrum-edge:
    image: ferrumedge/ferrum-edge:latest
    command: run -m database
    environment:
      FERRUM_MODE: database
      FERRUM_DB_TYPE: sqlite
      FERRUM_DB_URL: 'sqlite:///data/ferrum.db?mode=rwc'
      FERRUM_NAMESPACE: nexus
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?set FERRUM_ADMIN_JWT_SECRET}
      FERRUM_ADMIN_BIND_ADDRESS: 0.0.0.0
      FERRUM_ALLOW_INSECURE_ADMIN_HTTP: 'true' # in-network compose traffic only
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ferrumdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  ferrumdata:
