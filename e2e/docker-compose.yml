# The end-to-end stack: the packaged Nexus image, a pinned Ferrum Edge release,
# PostgreSQL, a deterministic upstream and a local mail sink (issue #285).
#
# Everything here is **pinned by digest**. A suite whose job is to prove that
# the portal's access decisions match what a real gateway permits cannot float
# its gateway version: a green run has to name the Edge build it was green
# against, and `:v0.9.5` can be re-tagged where a digest cannot.
#
# Nothing is published on a routable address. Each port is bound to loopback so
# a developer running this on a laptop is not exposing an unbootstrapped portal
# to their network.

name: ferrum-nexus-e2e

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_DB_PASSWORD:?set NEXUS_DB_PASSWORD}
      POSTGRES_DB: nexus
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 2s
      timeout: 3s
      retries: 30

  # The deterministic backend every published API points at. Echoes what it
  # received, so a test can tell "the gateway forwarded" from "the gateway
  # answered" — and can assert that the credential was stripped on the way.
  upstream:
    build:
      context: ./upstream
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9100/health').then(()=>0,()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # The mail sink. Verification mail is part of the journey under test, so it
  # has to be delivered somewhere a test can read it — not stubbed out.
  mail:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'

  ferrum-edge:
    image: ${FERRUM_EDGE_IMAGE:?set FERRUM_EDGE_IMAGE}
    command: run -m database
    environment:
      FERRUM_MODE: database
      FERRUM_DB_TYPE: sqlite
      FERRUM_DB_URL: 'sqlite:///data/ferrum.db?mode=rwc'
      FERRUM_NAMESPACE: nexus
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?set FERRUM_ADMIN_JWT_SECRET}
      FERRUM_BASIC_AUTH_HMAC_SECRET: ${FERRUM_BASIC_AUTH_HMAC_SECRET:?set FERRUM_BASIC_AUTH_HMAC_SECRET}
      FERRUM_ADMIN_BIND_ADDRESS: 0.0.0.0
      FERRUM_ALLOW_INSECURE_ADMIN_HTTP: 'true' # compose-network traffic only
    ports:
      # The **data plane**. Every "did the request actually reach the backend?"
      # assertion goes through this listener rather than through the Admin API,
      # which is the whole point of the suite.
      - '127.0.0.1:${FERRUM_PROXY_PORT:-8000}:8000'
      - '127.0.0.1:${FERRUM_ADMIN_PORT:-9000}:9000'
    volumes:
      - ferrumdata:/data
    depends_on:
      ferrum-edge-init:
        condition: service_completed_successfully

  # Edge v0.9.5 pre-creates /data for UID 65532. This one-shot chown also
  # repairs older root-owned volumes; it is a no-op on later starts.
  ferrum-edge-init:
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: ['chown', '65532:65532', '/data']
    volumes:
      - ferrumdata:/data
    restart: 'no'

  nexus:
    image: ${NEXUS_IMAGE:-ferrum-nexus:e2e}
    environment:
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:?set NEXUS_SECRET_KEY}
      NEXUS_BOOTSTRAP_TOKEN: ${NEXUS_BOOTSTRAP_TOKEN:?set NEXUS_BOOTSTRAP_TOKEN}
      NEXUS_PUBLIC_URL: http://127.0.0.1:${NEXUS_PORT:-8787}
      NEXUS_COOKIE_SECURE: 'false' # loopback HTTP
      NEXUS_DB_DRIVER: postgres
      NEXUS_DB_URL: postgres://nexus:${NEXUS_DB_PASSWORD:?set NEXUS_DB_PASSWORD}@postgres:5432/nexus
      FERRUM_ADMIN_URL: http://ferrum-edge:9000
      FERRUM_ADMIN_JWT_SECRET: ${FERRUM_ADMIN_JWT_SECRET:?set FERRUM_ADMIN_JWT_SECRET}
      FERRUM_ADMIN_ALLOW_INSECURE_HTTP: 'true' # compose-network traffic only
      FERRUM_NAMESPACE: nexus
      FERRUM_GATEWAY_PUBLIC_URL: http://127.0.0.1:${FERRUM_PROXY_PORT:-8000}
      # The upstream lives on the compose network, so the portal has to be
      # allowed to publish a private address. Test-only.
      NEXUS_ALLOW_PRIVATE_UPSTREAMS: 'true'
      # Rate limits off: the suite makes a burst of API calls in seconds and is
      # testing the gateway's behaviour, not the portal's throttling.
      NEXUS_RATE_LIMIT_ENABLED: 'false'
      NEXUS_SMTP_HOST: mail
      NEXUS_SMTP_PORT: '1025'
      NEXUS_SMTP_SECURE: 'false'
      NEXUS_SMTP_FROM: nexus@example.test
    ports:
      - '127.0.0.1:${NEXUS_PORT:-8787}:8787'
    depends_on:
      postgres:
        condition: service_healthy
      ferrum-edge:
        condition: service_started
      upstream:
        condition: service_started
      mail:
        condition: service_started

volumes:
  ferrumdata:
