name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quickstart-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify README full-stack Compose configuration
        run: env -i PATH="$PATH" HOME="$HOME" bash ci/check-compose-quickstart.sh

  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require full commit SHAs for third-party actions
        run: |
          unpinned=$(grep -rnE '^[[:space:]-]*uses:[[:space:]]*[^.[:space:]][^@[:space:]]*@' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Pin every action to a full commit SHA (keep the version as a trailing comment):"
            echo "$unpinned"
            exit 1
          fi

  checks:
    runs-on: ubuntu-latest
    env:
      npm_config_engine_strict: 'true'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '22', '24.15.0', '24', '26.0.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require digests for container images
        run: bash ci/check-image-pins.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify the actual Node qualification version
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          actual_node=$(node -p 'process.versions.node')
          case "$EXPECTED_NODE" in
            22|24|26) [[ "$actual_node" == "$EXPECTED_NODE".* ]] ;;
            *) [ "$actual_node" = "$EXPECTED_NODE" ] ;;
          esac
          printf 'Qualification runtime: Node `%s` (matrix `%s`).\n' \
            "$actual_node" "$EXPECTED_NODE" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check formatting and show required changes
        run: |
          if ! npm run format:check; then
            npm exec --no -- prettier --write .
            git diff --no-ext-diff
            exit 1
          fi
      - run: npm run build

  # #449: qualify every supported minimum and current major (released in v0.4.0).
  supported-node-minimum:
    name: Supported Node minimum
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the declared minimum and require matrix qualification
        if: ${{ always() }}
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          printf 'Existing checks matrix result: `%s`.\n' \
            "${CHECKS_RESULT:-missing}" >> "$GITHUB_STEP_SUMMARY"
          declared_range=$(jq -er '.engines.node | select(type == "string")' package.json)
          declared_nvm=$(cat .nvmrc)
          {
            printf 'Declared Node range (package.json): `%s`.\n' "$declared_range"
            printf 'Declared Node version (.nvmrc): `%s`.\n' "$declared_nvm"
          } >> "$GITHUB_STEP_SUMMARY"

          # Bind this report to the exact current matrix; reject include/exclude or other drift.
          checks_matrix=$(sed -n '/^  checks:$/,/^    steps:$/p' .github/workflows/ci.yml \
            | sed -n '/^      matrix:$/,$p')
          expected_matrix=$(printf '%s\n' '      matrix:' \
            "        node: ['22.22.2', '22', '24.15.0', '24', '26.0.0', '26']" '    steps:')
          if [ "$declared_range" != '^22.22.2 || ^24.15.0 || >=26.0.0' ] \
            || [ "$declared_nvm" != '22.22.2' ] \
            || [ "$checks_matrix" != "$expected_matrix" ]; then
            echo 'Minimum qualification: unverified declaration/matrix alignment.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Update the minimum declarations, checks matrix and gate together.'
            exit 1
          fi
          for manifest in shared/package.json server/package.json web/package.json e2e/package.json; do
            workspace_range=$(jq -er '.engines.node | select(type == "string")' "$manifest")
            if [ "$workspace_range" != "$declared_range" ]; then
              echo "::error::$manifest must declare the same supported Node range."
              exit 1
            fi
          done

          if [ "$CHECKS_RESULT" != 'success' ]; then
            echo 'Node 22.22.2 minimum qualification: not successful.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::The complete checks matrix must succeed to qualify the Node minimum.'
            exit 1
          fi
          echo 'Supported minima qualified by the successful checks matrix (22.22.2, 22, 24.15.0, 24, 26.0.0, 26).' \
            >> "$GITHUB_STEP_SUMMARY"

  # Non-blocking: coverage is reported for visibility, not enforced as a gate.
  # Keep this out of the required-checks list.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect server + web coverage
        run: |
          mkdir -p coverage-report
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-report/coverage-summary.txt
      - name: Gather lcov output
        if: always()
        run: |
          mkdir -p coverage-report
          if [ -f web/coverage/lcov.info ]; then
            cp web/coverage/lcov.info coverage-report/web-lcov.info
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14

  # One lane per pooled backend, each with its own 15-minute budget; the
  # combined suite outgrew a single job. Every lane also runs SQLite.
  store-contract-lanes:
    name: store-contracts (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            postgres_url: postgres://postgres:nexus_test@127.0.0.1:5432/postgres
          - backend: mysql
            mysql_url: mysql://root:nexus_test@127.0.0.1:3306/mysql
          - backend: mongodb
            mongo_url: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
            mongo_standalone_url: mongodb://127.0.0.1:27018/?directConnection=true
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo-standalone:
        image: mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start MongoDB replica set
        if: ${{ matrix.backend == 'mongodb' }}
        run: |
          docker run -d --name nexus-mongo -p 27017:27017 mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec nexus-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'; then
              break
            fi
            sleep 1
          done
          docker exec nexus-mongo mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          docker exec nexus-mongo mongosh --quiet --eval \
            'for (let i = 0; i < 60; i++) { if (db.hello().isWritablePrimary) quit(0); sleep(1000); } quit(1);'
      - run: npm ci
      - run: npm run build --workspace shared
      # Also the released-baseline upgrade fixture (issue #286) on every
      # backend; `npm test` in `checks` covers only its SQLite lane.
      - name: Run the ${{ matrix.backend }} and SQLite store contracts
        working-directory: server
        env:
          NEXUS_TEST_POSTGRES_URL: ${{ matrix.postgres_url }}
          NEXUS_TEST_MYSQL_URL: ${{ matrix.mysql_url }}
          NEXUS_TEST_MONGO_URL: ${{ matrix.mongo_url }}
          NEXUS_TEST_MONGO_STANDALONE_URL: ${{ matrix.mongo_standalone_url }}
        run: >-
          node --import tsx --test src/test/smoke.test.ts
          src/test/mysql-migration-recovery.test.ts src/test/mysql-user-transition.test.ts
          src/test/baseline-upgrade.test.ts

  # The required check: every backend lane must pass.
  store-contracts:
    needs: store-contract-lanes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every store-contract lane
        env:
          LANES_RESULT: ${{ needs.store-contract-lanes.result }}
        run: |
          if [ "$LANES_RESULT" != 'success' ]; then
            echo "::error::Every store-contract lane must pass (result: ${LANES_RESULT:-missing})."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ferrum-nexus:ci -f docker/Dockerfile .
      - name: Verify SQLite and bundled schemas in the production image
        run: >-
          docker run --rm ferrum-nexus:ci node --input-type=module -e
          "import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import Database from 'better-sqlite3';
          import { loadMigrations } from './server/dist/db/migrate.js';
          assert.ok(Number(process.versions.napi) >= 10);
          const priorityHashes = {
            sqlite: '0ffa16cce8d5a154877a1dadffc52b8ac3ad4cc8346d637b008ded2ec5fde31e',
            pg: '6bd48d66f70cd8b949dc168991e822db31ae49d3734b3cbcee81115b0d6c8b35',
            mysql: '633e786effcf93732d5b53987e42e3118bf789394b57295a3764440a69cddc16',
          };
          for (const dialect of ['sqlite', 'pg', 'mysql']) {
            const files = loadMigrations(dialect);
            assert.deepEqual(files.map((file) => file.id), ['001_initial', '002_api_gateway_plugins', '003_messages_thread_latest', '004_api_spec_changes', '005_notification_preferences', '006_user_identities', '007_outbox_recipient', '008_email_lifecycle_fence', '009_outbox_priority', '010_api_agents', '011_mcp_tool_subsets', '012_access_request_grant']);
            const priority = files.find((file) => file.id === '009_outbox_priority');
            assert.ok(priority);
            assert.equal(createHash('sha256').update(priority.sql).digest('hex'), priorityHashes[dialect]);
          }
          const db = new Database(':memory:');
          for (const file of loadMigrations('sqlite')) db.exec(file.sql);
          assert.deepEqual(db.prepare('SELECT agents_json FROM apis').all(), []);
          assert.deepEqual(db.prepare('SELECT generation FROM email_outbox').all(), []);
          assert.deepEqual(db.prepare('SELECT recipient_user_id FROM email_outbox').all(), []);
          assert.deepEqual(db.prepare('SELECT priority FROM email_outbox').all(), []);
          assert.deepEqual(db.prepare('SELECT email_lifecycle_fence FROM users').all(), []);
          assert.deepEqual(db.prepare('SELECT role FROM api_gateway_plugins').all(), []);
          assert.deepEqual(db.prepare('SELECT spec_id FROM api_spec_changes').all(), []);
          assert.deepEqual(db.prepare('SELECT user_id FROM user_notification_preferences').all(), []);
          assert.deepEqual(db.prepare('SELECT id FROM user_identities').all(), []);
          assert.deepEqual(db.prepare('SELECT user_id FROM user_email_proofs').all(), []);
          assert.deepEqual(db.prepare('SELECT user_id FROM user_password_locks').all(), []);
          assert.deepEqual(db.prepare('SELECT name FROM sqlite_master WHERE type = ? AND name LIKE ? ORDER BY name').all('index', 'ix_messages_thread%'), [{ name: 'ix_messages_thread_latest' }]);
          assert.deepEqual(db.prepare('SELECT 1 AS ok').get(), { ok: 1 });
          db.close();"

  # The release gate: the **packaged** portal against a real, pinned Ferrum
  # Edge release, asserting through the gateway's data-plane listener rather
  # than through its Admin API. Everything else in CI tests Nexus against a
  # mock gateway, which can only ever confirm that the portal sent the
  # configuration it meant to send (issue #285).
  #
  # A required check in the `main` ruleset: a change that makes a real gateway
  # refuse a request the portal says it approved is exactly what this exists to
  # stop shipping. The Edge release is pinned in release/compatibility.env,
  # which run.sh copies into the e2e/.env a fresh checkout does not have.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Test the acceptance runner
        run: bash e2e/test-run.sh
      - name: Build the production image
        run: docker build -t ferrum-nexus:e2e -f docker/Dockerfile .
      - name: Install the suite's dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Type-check the acceptance suite
        run: npm --prefix e2e run typecheck
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the acceptance suite
        env:
          NEXUS_IMAGE: ferrum-nexus:e2e
        run: ./e2e/run.sh
      - name: Upload logs, traces and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-artifacts
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
