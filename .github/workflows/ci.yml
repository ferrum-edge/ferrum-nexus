name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check formatting and show required changes
        run: |
          if ! npm run format:check; then
            npm exec --no -- prettier --write .
            git diff --no-ext-diff
            exit 1
          fi
      - run: npm run build

  # Non-blocking: coverage is reported for visibility, not enforced as a gate.
  # Keep this out of the required-checks list.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect server + web coverage
        run: |
          mkdir -p coverage-report
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-report/coverage-summary.txt
      - name: Gather lcov output
        if: always()
        run: |
          mkdir -p coverage-report
          if [ -f web/coverage/lcov.info ]; then
            cp web/coverage/lcov.info coverage-report/web-lcov.info
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14

  store-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nexus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pnexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start MongoDB replica set
        run: |
          docker run -d --name nexus-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec nexus-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'; then
              break
            fi
            sleep 1
          done
          docker exec nexus-mongo mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          docker exec nexus-mongo mongosh --quiet --eval \
            'for (let i = 0; i < 60; i++) { if (db.hello().isWritablePrimary) quit(0); sleep(1000); } quit(1);'
      - run: npm ci
      - run: npm run build --workspace shared
      - name: Run all four store contracts
        working-directory: server
        env:
          NEXUS_TEST_POSTGRES_URL: postgres://postgres:nexus_test@127.0.0.1:5432/postgres
          NEXUS_TEST_MYSQL_URL: mysql://root:nexus_test@127.0.0.1:3306/mysql
          NEXUS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: >-
          node --import tsx --test src/test/smoke.test.ts
          src/test/mysql-migration-recovery.test.ts src/test/mysql-user-transition.test.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ferrum-nexus:ci -f docker/Dockerfile .
      - name: Verify SQLite and bundled schemas in the production image
        run: >-
          docker run --rm ferrum-nexus:ci node --input-type=module -e
          "import assert from 'node:assert/strict';
          import Database from 'better-sqlite3';
          import { loadMigrations } from './server/dist/db/migrate.js';
          assert.ok(Number(process.versions.napi) >= 10);
          for (const dialect of ['sqlite', 'pg', 'mysql']) {
            assert.deepEqual(loadMigrations(dialect).map((file) => file.id), ['001_initial']);
          }
          const db = new Database(':memory:');
          db.exec(loadMigrations('sqlite')[0].sql);
          assert.deepEqual(db.prepare('SELECT generation FROM email_outbox').all(), []);
          assert.deepEqual(db.prepare('SELECT 1 AS ok').get(), { ok: 1 });
          db.close();"

  # The release gate: the **packaged** portal against a real, pinned Ferrum
  # Edge release, asserting through the gateway's data-plane listener rather
  # than through its Admin API. Everything else in CI tests Nexus against a
  # mock gateway, which can only ever confirm that the portal sent the
  # configuration it meant to send (issue #285).
  #
  # Treat a failure as blocking: a change that makes a real gateway refuse a
  # request the portal says it approved is exactly what this exists to stop
  # shipping. (It is not in the `main` ruleset's required checks.) The Edge
  # release is pinned only in e2e/.env.example, which run.sh copies into the
  # e2e/.env a fresh checkout does not have.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build the production image
        run: docker build -t ferrum-nexus:e2e -f docker/Dockerfile .
      - name: Install the suite's dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the acceptance suite
        env:
          NEXUS_IMAGE: ferrum-nexus:e2e
        run: ./e2e/run.sh
      - name: Upload logs, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
