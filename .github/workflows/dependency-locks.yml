name: Dependency lock artifacts

# Optional producer only. The existing required CI jobs validate the head on
# which a reviewer applies these artifacts; this workflow never writes to Git.
on:
  pull_request:
    paths:
      - package.json
      - shared/package.json
      - server/package.json
      - web/package.json
      - e2e/package.json
      - .nvmrc
      - .github/workflows/ci.yml
      - .github/workflows/dependency-locks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Record immutable inputs and generate locks without lifecycle scripts
        env:
          npm_config_engine_strict: 'true'
        run: |
          mkdir -p lock-artifacts/e2e lock-artifacts/provenance
          git rev-parse HEAD > lock-artifacts/provenance/source-sha.txt
          sha256sum package.json shared/package.json server/package.json web/package.json \
            e2e/package.json package-lock.json e2e/package-lock.json \
            .nvmrc .github/workflows/ci.yml .github/workflows/dependency-locks.yml \
            > lock-artifacts/provenance/input.sha256
          node --version > lock-artifacts/provenance/node-version.txt
          test "$(cat lock-artifacts/provenance/node-version.txt)" = 'v22.22.2'
          npm --version > lock-artifacts/provenance/npm-version.txt
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > lock-artifacts/provenance/run.txt
          # Keep the committed graphs as npm's resolution inputs. The fresh
          # root graph needed for the Vitest 4 -> 5 migration is already applied.
          cp package-lock.json lock-artifacts/provenance/root-input-lock.json
          cp e2e/package-lock.json lock-artifacts/provenance/e2e-input-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix e2e install --package-lock-only --ignore-scripts --no-audit --no-fund
          # npm's own semver, the library that evaluates `engines` for it.
          NPM_SEMVER="$(npm root -g)/npm/node_modules/semver"
          test -f "$NPM_SEMVER/package.json"
          export NPM_SEMVER
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { isDeepStrictEqual } from 'node:util';
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const root = readJson('package-lock.json');
          const e2e = readJson('e2e/package-lock.json');
          const rootInput = readJson('lock-artifacts/provenance/root-input-lock.json');
          const e2eInput = readJson('lock-artifacts/provenance/e2e-input-lock.json');
          const manifests = Object.fromEntries(
            ['', 'shared', 'server', 'web'].map((path) => [
              path,
              readJson(path ? `${path}/package.json` : 'package.json'),
            ]),
          );
          const e2eManifest = readJson('e2e/package.json');
          const fields = [
            'name',
            'version',
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies',
            'peerDependenciesMeta',
            'engines',
            'workspaces',
          ];
          const locks = [
            [root, rootInput, manifests],
            [e2e, e2eInput, { '': e2eManifest }],
          ];
          for (const [lock, input, sources] of locks) {
            let unchanged = true;
            for (const [path, manifest] of Object.entries(sources)) {
              assert.ok(lock.packages[path], `Missing manifest entry: ${path}`);
              for (const field of fields) {
                assert.deepEqual(lock.packages[path][field], manifest[field], `${path}: ${field}`);
                unchanged &&= isDeepStrictEqual(input.packages[path]?.[field], manifest[field]);
              }
            }
            // An e2e-only update must not refresh the root graph (or vice versa).
            if (unchanged) assert.deepEqual(lock, input, 'Unexpected graph change');
          }
          const typescript = manifests.shared.devDependencies.typescript;
          const vitest = manifests.web.devDependencies.vitest;
          assert.match(typescript, /^\d+\.\d+\.\d+$/);
          assert.match(vitest, /^\d+\.\d+\.\d+$/);
          for (const manifest of [manifests.server, manifests.web, e2eManifest]) {
            assert.equal(manifest.devDependencies.typescript, typescript);
          }
          assert.equal(manifests.web.devDependencies['@vitest/coverage-v8'], vitest);
          const rangedVersion = (workspace, name) => {
            const spec = manifests[workspace].dependencies[name];
            assert.equal(typeof spec, 'string', name);
            const inputSpec = rootInput.packages[workspace]?.dependencies?.[name];
            const lock = spec === inputSpec ? rootInput : root;
            return lock.packages[`node_modules/${name}`].version;
          };
          const versions = {
            typescript,
            vitest,
            zod: rangedVersion('server', 'zod'),
            '@tanstack/react-table': rangedVersion('web', '@tanstack/react-table'),
          };
          for (const [name, version] of Object.entries(versions)) {
            assert.equal(root.packages[`node_modules/${name}`]?.version, version, name);
          }
          assert.equal(root.packages['node_modules/@vitest/coverage-v8']?.version, vitest);
          assert.equal(e2e.packages['node_modules/typescript']?.version, typescript);
          // jsdom and Undici set the supported Node floor (#449). No version or
          // integrity is written here, so a reviewed bump (Dependabot's
          // included) passes. This proves that both are in the regenerated
          // locks, and that every copy was resolved from the npm registry with
          // a sha512 integrity and declares `engines` that admit every Node
          // version a manifest of its lock supports: no bump can raise the
          // floor unless the manifests' `engines` move with it. That each copy
          // is the reviewed tarball is the graph check above: a lock whose
          // manifests are unchanged must equal the committed one, integrity
          // included, and any other change is a diff the reviewer applies.
          const semver = createRequire(`${process.cwd()}/`)(process.env.NPM_SEMVER);
          const registry = (name) => `https://registry.npmjs.org/${name}/-/${name}-`;
          const found = new Set();
          for (const [lock, , sources] of locks) {
            const supported = Object.values(sources).map((manifest) => manifest.engines?.node);
            for (const range of supported) assert.equal(typeof range, 'string', 'engines.node');
            for (const [path, pkg] of Object.entries(lock.packages)) {
              for (const [name, version] of Object.entries(versions)) {
                if (path.endsWith(`node_modules/${name}`)) assert.equal(pkg.version, version, path);
              }
              const vitestPackage = path.match(/(?:^|\/)node_modules\/@vitest\/([^/]+)$/)?.[1];
              if (vitestPackage && !vitestPackage.startsWith('istanbul-lib-')) {
                assert.equal(pkg.version, vitest, path);
              }
              const pinned = path.match(/(?:^|\/)node_modules\/(jsdom|undici)$/)?.[1];
              if (!pinned) continue;
              found.add(pinned);
              assert.ok(pkg.resolved?.startsWith(registry(pinned)), `${path}: resolved`);
              assert.match(pkg.integrity ?? '', /^sha512-[A-Za-z0-9+/]{86}==$/, `${path}: integrity`);
              const engines = pkg.engines?.node;
              assert.equal(typeof engines, 'string', `${path}: engines`);
              for (const range of supported) {
                assert.ok(semver.subset(range, engines), `${path}: ${engines} excludes ${range}`);
              }
            }
          }
          assert.deepEqual([...found].sort(), ['jsdom', 'undici']);
          JS
          git diff --check
          git diff --no-ext-diff -- package-lock.json e2e/package-lock.json > lock-artifacts/locks.diff
          cp package-lock.json lock-artifacts/package-lock.json
          cp e2e/package-lock.json lock-artifacts/e2e/package-lock.json
          cd lock-artifacts
          sha256sum package-lock.json e2e/package-lock.json locks.diff > provenance/output.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-locks-${{ github.event.pull_request.head.sha || github.sha }}
          path: lock-artifacts/
          if-no-files-found: error
          retention-days: 14
